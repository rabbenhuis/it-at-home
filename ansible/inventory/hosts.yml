---
# Fallback inventory; scripts/build-template.sh targets hosts inline.
all:
  children:
    native:
      hosts:
        tmpl-debian13-native-build:
          ansible_host: 192.168.70.90
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    # Proxmox VE hosts; scripts/pve-hosts.sh targets them inline. The pve role
    # creates the ansible/sysadm1n users on first (--bootstrap) run.
    pve:
      hosts:
        pve1:
          ansible_host: 192.168.70.64
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        pve2:
          ansible_host: bm-pve-prd-02.abbenhuis.internal
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    lxc_templates:
      children:
        native:
        podman:
        docker: