# AdGuard Home role defaults. Override per host/play via group_vars or -e.
adguard_version: "latest"
adguard_install_dir: "/opt/AdGuardHome"

# Download URL is built in tasks from adguard_arch (x86_64 -> amd64, aarch64 -> arm64).
adguard_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] == 'aarch64' else ansible_facts['architecture'] }}"
adguard_download_url: "https://github.com/AdguardTeam/AdGuardHome/releases/{{ adguard_version }}/download/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"

adguard_web_listen: "0.0.0.0"
adguard_web_port: 3000
adguard_dns_listen: "0.0.0.0"
adguard_dns_port: 53

adguard_upstream_dns:
  - 192.168.90.41 # primary unbound
  - 192.168.90.43
# Upstreams are plain-IP (no hostnames), so no bootstrap/fallback DNS is needed.
adguard_bootstrap_dns: []
adguard_fallback_dns: []

# Private (RFC1918) reverse lookups - including AdGuard's client rDNS - are
# routed to these "private reverse DNS servers" (not the main upstreams), so
# static PTRs served by unbound resolve here. Enable + point at unbound.
adguard_use_private_ptr_resolvers: true
adguard_local_ptr_upstreams:
  - 192.168.90.43

adguard_filters:
  - name: "AdGuard DNS filter"
    url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"
  - name: "OISD Big"
    url: "https://big.oisd.nl/"
  - name: "Phishing Army"
    url: "https://phishing.army/download/phishing_army_blocklist_extended.txt"

# Static DNS records served by AdGuard (override upstream). `answer` can be an
# IP address (A/AAAA record) or another hostname (CNAME record). E.g.
#   - {domain: "nas.abbenhuis.internal", answer: "192.168.90.10"}            # A
#   - {domain: "adguard.abbenhuis.internal", answer: "adguard-sec01.infra.abbenhuis.internal"}  # CNAME
# NOTE: internal records now live in the unbound per-view data (ansible/roles/
# unbound), NOT here - global rewrites would bypass the per-VLAN DNS views.
adguard_rewrites: []

# Device registry: each device gets an A record (<hostname>.<zone> -> ip) and
# its aliases (full domain names) become CNAMEs pointing at that A record. The
# `mac` is metadata for the router's DHCP reservation (so the device actually
# gets `ip`) - the router hands out addresses, AdGuard only serves the DNS.
#   - hostname: "nas"
#     mac: "aa:bb:cc:dd:ee:ff"
#     ip: "192.168.90.10"
#     aliases: ["files.abbenhuis.net", "backup.abbenhuis.net"]
# NOTE: device records have moved into the unbound per-view data (see unbound role).
adguard_device_zone: "abbenhuis.internal"
adguard_devices: []

# DNS views: route each VLAN's queries to a specific unbound view instance via
# per-client upstreams. `ids` are the VLAN subnets; `port` matches the unbound
# view port (see unbound role). use_global_settings=true keeps global filtering.
adguard_view_upstream_servers:
  - 192.168.90.41
  - 192.168.90.43
adguard_view_clients:
  - { name: "view-internal-full",
      ids: ["192.168.37.0/24", "192.168.70.0/24", "192.168.75.0/24", "192.168.80.0/24", "192.168.90.0/24", "192.168.95.0/24", "192.168.100.0/24", "192.168.115.0/24"],
      port: 5353 }
  - { name: "view-internal-limited",
      ids: ["192.168.120.0/24", "192.168.122.0/24", "192.168.132.0/24"],
      port: 5354 }
  - { name: "view-iot-platform",
      ids: ["192.168.150.0/24"],
      port: 5355 }
  - { name: "view-iot-limited",
      ids: ["192.168.152.0/24"],
      port: 5356 }
  - { name: "view-gaming-limited",
      ids: ["192.168.160.0/24"],
      port: 5357 }

# Web UI accounts: [{name: admin, password: "<bcrypt hash>"}]. Generate a hash
# with: htpasswd -nbB admin <password>. Empty list = no authentication.
adguard_users: []

adguard_protection_enabled: true
adguard_filtering_blocking_mode: "default"
adguard_safe_search_enabled: false
adguard_safe_browsing_enabled: false
adguard_parental_enabled: false
adguard_cache_size: 4194304
adguard_schema_version: 29
