---
- name: Create AdGuard Home install directory
  ansible.builtin.file:
    path: "{{ adguard_install_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download AdGuard Home binary
  ansible.builtin.get_url:
    url: "{{ adguard_download_url }}"
    dest: "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
    mode: "0644"

- name: Extract AdGuard Home binary
  ansible.builtin.unarchive:
    src: "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
    dest: "{{ adguard_install_dir }}"
    remote_src: true
    creates: "{{ adguard_install_dir }}/AdGuardHome"

# The release tarball has a top-level AdGuardHome/ dir; the unarchive module
# does not reliably apply extra_opts (--strip-components) with remote_src, so
# flatten it here in case it extracted nested.
- name: Flatten AdGuard Home directory layout
  ansible.builtin.shell: |
    if [ -d "{{ adguard_install_dir }}/AdGuardHome" ] && [ -f "{{ adguard_install_dir }}/AdGuardHome/AdGuardHome" ]; then
      mv "{{ adguard_install_dir }}/AdGuardHome/AdGuardHome" "{{ adguard_install_dir }}/.AdGuardHome.bin"
      rm -rf "{{ adguard_install_dir }}/AdGuardHome"
      mv "{{ adguard_install_dir }}/.AdGuardHome.bin" "{{ adguard_install_dir }}/AdGuardHome"
    fi
  changed_when: false

- name: Remove downloaded archive
  ansible.builtin.file:
    path: "/tmp/AdGuardHome_linux_{{ adguard_arch }}.tar.gz"
    state: absent

- name: Check whether systemd-resolved is present
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/systemd-resolved.service
  register: adguard_resolved_unit

- name: Disable systemd-resolved stub listener (frees port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  when: adguard_resolved_unit.stat.exists

- name: Write AdGuard Home configuration
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: "{{ adguard_install_dir }}/AdGuardHome.yaml"
    mode: "0644"
    owner: root
    group: root
  # AdGuard normalizes/migrates the file on start (e.g. schema_version 29->34),
  # so the template diff always shows 'changed'. The restart is decided below
  # by comparing the hash of OUR rendered config instead.
  changed_when: false

- name: Hash rendered configuration
  ansible.builtin.command: sha256sum "{{ adguard_install_dir }}/AdGuardHome.yaml"
  register: adguard_config_hash
  changed_when: false

- name: Read previous configuration hash
  ansible.builtin.slurp:
    path: "{{ adguard_install_dir }}/.config-hash"
  register: adguard_prev_hash
  failed_when: false

- name: Persist configuration hash
  ansible.builtin.copy:
    content: "{{ adguard_config_hash.stdout.split(' ')[0] }}\n"
    dest: "{{ adguard_install_dir }}/.config-hash"
    mode: "0644"

- name: Check AdGuard Home service unit
  ansible.builtin.stat:
    path: /etc/systemd/system/AdGuardHome.service
  register: adguard_unit_file

- name: Restart AdGuard Home on configuration change
  ansible.builtin.systemd:
    name: AdGuardHome
    state: restarted
  when: adguard_unit_file.stat.exists and (adguard_prev_hash.content | default("") | b64decode | trim) != adguard_config_hash.stdout.split(" ")[0]

- name: Install AdGuard Home systemd unit
  ansible.builtin.template:
    src: AdGuardHome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    mode: "0644"
    owner: root
    group: root
  notify: restart AdGuardHome

- name: Enable and start AdGuard Home
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for AdGuard Home DNS listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ adguard_dns_port }}"
    timeout: 60