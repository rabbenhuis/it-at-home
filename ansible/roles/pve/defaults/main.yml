---
# Mail relay used by the security-scan cron emails (same as the base role).
msmtp_host: mta.abbenhuis.internal
msmtp_port: 25
msmtp_from: notify@abbenhuis.net
msmtp_user: ""
msmtp_password: ""
msmtp_auth: "off"
msmtp_tls: "off"
msmtp_logfile: /var/log/msmtp

# From header for unattended-upgrades result emails. Rendered with the real
# hostname on the PVE host (the pve role runs directly on it, not via a clone).
unattended_upgrades_sender: "{{ ansible_facts['hostname'] }} <{{ ansible_facts['hostname'] }}@abbenhuis.net>"

# OS password (SHA-512 crypt hash) for the sysadm1n account. PVE users in the
# pam realm authenticate against the OS user, so without a password the PVE web
# GUI login as sysadm1n@pam cannot work (SSH is key-only anyway). Empty =
# leave the account as-is (locked). The hash is passed by scripts/pve-hosts.sh
# from PVE_SYSADM1N_PASSWORD (env or a bws secret); never commit plaintext here.
pve_sysadm1n_password_hash: ""

# Privileges granted to the PVE role "Terraform-Infra" (mirrors the
# manually-created TerraformRole on pve1; used by build-template.sh and
# deploy-hosts.sh to manage VMs, containers, storage and templates).
pve_terraform_infra_privs:
  - VM.Config.HWType
  - VM.Config.Cloudinit
  - Pool.Audit
  - VM.Config.CDROM
  - Sys.Modify
  - VM.Audit
  - Datastore.AllocateSpace
  - SDN.Use
  - Pool.Allocate
  - VM.Config.Options
  - VM.Allocate
  - VM.PowerMgmt
  - VM.Clone
  - Datastore.AllocateTemplate
  - VM.Config.Disk
  - VM.Migrate
  - Sys.Audit
  - Sys.Console
  - VM.Config.Network
  - VM.Config.Memory
  - VM.Config.CPU
  - Datastore.Audit
  # QEMU guest agent: the bpg provider reads the VM's network interfaces from
  # the agent (needs Audit); Unrestricted covers the full agent API the provider
  # may use. Without these the provider logs 403 "Permission check failed"
  # (/vms/<id>, VM.GuestAgent.Audit|VM.GuestAgent.Unrestricted) when waiting for
  # the agent's network info.
  - VM.GuestAgent.Audit
  - VM.GuestAgent.Unrestricted

# Older role names superseded by Terraform-Infra (PVE cannot rename roles, so
# they are deleted once no ACL references them anymore).
pve_obsolete_roles:
  - TerraformRole
  - Terraform-Deployer
  - TerraForm-Infra

# Privileges granted to the PVE role "Terraform-Backup", scoped to the backup
# storage path (/storage/nas) only. Keeps Datastore.Allocate off the
# cluster-wide Terraform-Infra role; needed to create/edit the vzdump backup
# jobs that deploy/backup.tf manages (tier-0..tier-3).
pve_terraform_backup_privs:
  - Datastore.Allocate
  - Datastore.Audit