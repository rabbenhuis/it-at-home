---
# mDNS reflector across VLANs. True reflection (not just announcing): avahi
# copies mDNS packets between the interfaces listed in allow-interfaces.
#
# IMPORTANT: the reflector keys live under [reflector], NOT [server]. avahi
# treats an unknown key in a section as FATAL (logs "Invalid configuration key"
# and exits 255), so a config written with enable-reflector under [server]
# silently never starts. The template keeps them in the right section.
- name: Install avahi-daemon
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Deploy avahi-daemon config (reflector)
  ansible.builtin.template:
    src: avahi-daemon.conf.j2
    dest: /etc/avahi/avahi-daemon.conf
    mode: "0644"
    owner: root
    group: root
  notify: restart avahi-daemon

# The extra (link-only) NICs are created by PVE without an IP config, so they
# start DOWN and avahi cannot reflect on them. Bring them up before avahi.
- name: Deploy avahi link-only NIC up script
  ansible.builtin.template:
    src: avahi-linkonly-up.sh.j2
    dest: /usr/local/sbin/avahi-linkonly-up.sh
    mode: "0755"
    owner: root
    group: root

- name: Deploy avahi link-only NIC up unit
  ansible.builtin.template:
    src: avahi-linkonly-nics.service.j2
    dest: /etc/systemd/system/avahi-linkonly-nics.service
    mode: "0644"
    owner: root
    group: root

- name: Reload systemd for the new unit
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable avahi link-only NIC up unit (boot persistence)
  ansible.builtin.systemd:
    name: avahi-linkonly-nics
    enabled: true

- name: Bring up avahi link-only NICs now (idempotent)
  ansible.builtin.command: /usr/local/sbin/avahi-linkonly-up.sh
  changed_when: false

- name: Enable and start avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started