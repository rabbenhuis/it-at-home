---
# Systemd-networkd on this cloud image auto-starts a DHCPv6 client (triggered
# by IPv6 RA/NDisc handling implied by LinkLocalAddressing=ipv6) even on a
# purely static-IPv4 config. On Debian 13/systemd 257 that client fails with
# ENOENT, marking the interface 'failed' and refusing to retry, so the static
# IPv4 from cloud-init never gets applied at boot (the host only gets an IPv6
# link-local). netplan apply/reconfigure works around it, but it recurs on
# every boot. Disable IPv6 RA + link-local + DHCPv6 on eth0 via a netplan
# override that merges with the cloud-init-generated config on every clone.
# If this file is ever truncated during a template build, firstboot.sh (written
# early in the base role) regenerates it at clone first boot.
- name: Disable IPv6 RA/DHCPv6 on eth0 (boot-time networkd failure fix)
  ansible.builtin.copy:
    dest: /etc/netplan/99-ipv4-only.yaml
    mode: "0600"
    owner: root
    group: root
    content: |
      network:
        version: 2
        ethernets:
          eth0:
            accept-ra: false
            link-local: []
            dhcp6: false

- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install acct (process accounting - works in a full VM)
  ansible.builtin.apt:
    name: acct
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable process accounting
  ansible.builtin.command: accton /var/log/account/pacct
  register: accton_result
  changed_when: false
  failed_when: accton_result.rc != 0 and 'already enabled' not in accton_result.stderr

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started