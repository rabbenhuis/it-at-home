---
- name: Update apt cache and full-upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: full
    autoremove: true
    autoclean: true
    cache_valid_time: 3600
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install hardening packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - gnupg
      - sudo
      - git
      - jq
      - less
      - bash-completion
      - needrestart
      - unattended-upgrades
      - apt-listchanges
      - fail2ban
      - lynis
      - aide
      - debsecan
      - debsums
      - acct
      - msmtp
      - msmtp-mta
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Configure unattended-upgrades (periodic)
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    owner: root
    group: root

- name: Configure unattended-upgrades (no reboot, purge unused)
  ansible.builtin.copy:
    src: 51unattended-upgrades
    dest: /etc/apt/apt.conf.d/51unattended-upgrades
    mode: "0644"
    owner: root
    group: root

- name: Apply sysctl hardening
  ansible.builtin.template:
    src: sysctl-99-hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    mode: "0644"
    owner: root
    group: root

- name: Apply our sysctl settings
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-hardening.conf
  changed_when: false
  ignore_errors: true

- name: Write sshd hardening drop-in
  ansible.builtin.template:
    src: sshd-99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    owner: root
    group: root

- name: Create ansible deploy user
  ansible.builtin.user:
    name: ansible
    comment: deployment user
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Create sysadm1n maintenance user
  ansible.builtin.user:
    name: sysadm1n
    comment: maintenance user
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true
    state: present

- name: Allow ansible passwordless sudo
  ansible.builtin.copy:
    src: sudoers-ansible
    dest: /etc/sudoers.d/99-ansible
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Allow sysadm1n passwordless sudo
  ansible.builtin.copy:
    src: sudoers-sysadm1n
    dest: /etc/sudoers.d/99-sysadm1n
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

- name: Authorize id_ed25519 for ansible user
  ansible.posix.authorized_key:
    user: ansible
    key: "{{ lookup('file', role_path + '/files/id_ed25519.pub') }}"
    state: present

- name: Authorize richard key for sysadm1n
  ansible.posix.authorized_key:
    user: sysadm1n
    key: "{{ lookup('file', role_path + '/files/id_rsa.pub') }}"
    state: present

- name: Configure fail2ban sshd jail
  ansible.builtin.copy:
    src: fail2ban-jail.local
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    owner: root
    group: root

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  ignore_errors: true

- name: Enable process accounting (acct)
  ansible.builtin.command: accton /var/log/account/pacct
  register: accton_result
  changed_when: false
  failed_when: accton_result.rc != 0 and 'already enabled' not in accton_result.stderr

- name: Run lynis security audit (build-time baseline)
  ansible.builtin.command: lynis audit system --quick --no-colors --logfile /var/log/lynis.log
  changed_when: false
  ignore_errors: true

- name: Create journald config directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Harden journald
  ansible.builtin.copy:
    src: journald-hardening.conf
    dest: /etc/systemd/journald.conf.d/hardening.conf
    mode: "0644"
    owner: root
    group: root

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Restrict cron usage to root and admin users
  ansible.builtin.copy:
    src: cron.allow
    dest: /etc/cron.allow
    mode: "0600"
    owner: root
    group: root

- name: Remove at daemon if present
  ansible.builtin.apt:
    name: at
    state: absent
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Tighten login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}.*"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: UMASK, value: "027" }
    - { key: PASS_MAX_DAYS, value: "90" }
    - { key: PASS_MIN_DAYS, value: "1" }

- name: Remove setuid bits from su, mount, umount, wall
  ansible.builtin.shell: |
    for b in /bin/su /bin/mount /bin/umount /usr/bin/wall; do
      [[ -f "$b" ]] && chmod u-s "$b" 2>/dev/null || true
    done
  changed_when: false

- name: Set timezone to Europe/Amsterdam
  ansible.builtin.copy:
    content: "Europe/Amsterdam\n"
    dest: /etc/timezone
    mode: "0644"
    owner: root
    group: root

- name: Link localtime
  ansible.builtin.file:
    src: /usr/share/zoneinfo/Europe/Amsterdam
    dest: /etc/localtime
    state: link
    force: true

- name: Enable systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started
  ignore_errors: true

- name: Schedule weekly lynis and debsecan scans
  ansible.builtin.template:
    src: security-tools.cron.j2
    dest: /etc/cron.d/security-tools
    mode: "0644"
    owner: root
    group: root

- name: Write msmtp config for lynis report emails
  ansible.builtin.template:
    src: msmtprc.j2
    dest: /etc/msmtprc
    mode: "0600"
    owner: root
    group: root

- name: Create msmtp logfile
  ansible.builtin.file:
    path: /var/log/msmtp
    state: touch
    mode: "0600"
    owner: root
    group: root

- name: Forward system cron mail to a fully-qualified address
  ansible.builtin.lineinfile:
    path: /etc/crontab
    regexp: "^MAILTO="
    line: "MAILTO=notify@abbenhuis.net"
    insertafter: "^PATH="
    create: true

- name: Configure aide exclusions for containers
  ansible.builtin.template:
    src: aide-99-container.conf.j2
    dest: /etc/aide/aide.conf.d/99-container.conf
    mode: "0644"
    owner: root
    group: root

- name: Install first-boot provisioning script
  ansible.builtin.template:
    src: firstboot.sh.j2
    dest: /usr/local/bin/firstboot.sh
    mode: "0700"
    owner: root
    group: root

- name: Install first-boot provisioning unit
  ansible.builtin.template:
    src: firstboot.service.j2
    dest: /etc/systemd/system/firstboot.service
    mode: "0644"
    owner: root
    group: root

- name: Enable first-boot provisioning unit
  ansible.builtin.systemd:
    name: firstboot
    enabled: true

- name: Clean apt caches and remove obsolete packages
  ansible.builtin.apt:
    autoremove: true
    purge: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Clean apt package cache
  ansible.builtin.apt:
    autoclean: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Drop cached apt lists
  ansible.builtin.command: rm -rf /var/lib/apt/lists/*
  changed_when: false

- name: Exclude docs and man pages from future packages
  ansible.builtin.copy:
    src: 99nocache
    dest: /etc/apt/apt.conf.d/99nocache
    mode: "0644"
    owner: root
    group: root

- name: Validate sshd configuration
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Remove id_ed25519 build key from root
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', role_path + '/files/id_ed25519.pub') }}"
    state: absent

- name: Lock root password
  ansible.builtin.command: passwd -l root
  changed_when: false

- name: Reset machine-id, SSH host keys and first-boot marker for clean clones
  ansible.builtin.shell: |
    rm -f /etc/machine-id /var/lib/dbus/machine-id
    rm -f /etc/ssh/ssh_host_*
    rm -f /var/lib/firstboot.done
    rm -f /var/lib/aide/aide.db /var/lib/aide/aide.db.new
  changed_when: false

- name: Clear shell history and temp files
  ansible.builtin.shell: |
    find /tmp /var/tmp -mindepth 1 -maxdepth 1 ! -name 'ansible_*' -exec rm -rf {} + 2>/dev/null || true
    rm -f /root/.bash_history /home/ansible/.bash_history /home/sysadm1n/.bash_history
  changed_when: false