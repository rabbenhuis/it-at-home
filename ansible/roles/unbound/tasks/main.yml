---
- name: Check whether systemd-resolved is present
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/systemd-resolved.service
  register: unbound_resolved_unit

- name: Disable systemd-resolved stub listener (frees port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  when: unbound_resolved_unit.stat.exists

- name: Install unbound and root hints
  ansible.builtin.apt:
    name:
      - unbound
      - dns-root-data
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Write unbound configuration
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: /etc/unbound/unbound.conf
    mode: "0644"
    owner: root
    group: root
  notify: restart unbound

- name: Install unbound systemd unit
  ansible.builtin.template:
    src: unbound.service.j2
    dest: /etc/systemd/system/unbound.service
    mode: "0644"
    owner: root
    group: root
  notify: restart unbound

- name: Validate unbound configuration
  ansible.builtin.command: unbound-checkconf /etc/unbound/unbound.conf
  register: unbound_checkconf
  changed_when: false
  failed_when: unbound_checkconf.rc != 0

- name: Enable and start unbound
  ansible.builtin.systemd:
    name: unbound
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for unbound DNS listener
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 53
    timeout: 60

# ---- DNS view instances (separate unbound processes, one per view) ----

- name: Install unbound view systemd unit
  ansible.builtin.template:
    src: unbound@.service.j2
    dest: /etc/systemd/system/unbound@.service
    mode: "0644"
    owner: root
    group: root
  notify: restart unbound

- name: Create unbound views directory
  ansible.builtin.file:
    path: /etc/unbound/views
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Render unbound view configurations
  ansible.builtin.template:
    src: unbound-view.conf.j2
    dest: "/etc/unbound/views/{{ item.key }}.conf"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ unbound_views | dict2items }}"
  register: unbound_view_render
  vars:
    view_name: "{{ item.key }}"
    view: "{{ item.value }}"

- name: Render unbound view auth-zone zonefiles
  ansible.builtin.template:
    src: unbound-zonefile.j2
    dest: "/etc/unbound/views/{{ item.0.key }}.{{ item.1.name }}.zone"
    mode: "0644"
    owner: root
    group: unbound
  loop: "{{ unbound_views | dict2items | product(unbound_auth_zones) | list }}"
  register: unbound_view_zone_render
  vars:
    view_name: "{{ item.0.key }}"
    view: "{{ item.0.value }}"
    zone_name: "{{ item.1.name }}"

- name: Validate unbound view configurations
  ansible.builtin.command: unbound-checkconf /etc/unbound/views/{{ item.key }}.conf
  loop: "{{ unbound_views | dict2items }}"
  changed_when: false

- name: Enable and start unbound view instances
  ansible.builtin.systemd:
    name: "unbound@{{ item.key }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ unbound_views | dict2items }}"

- name: Restart unbound views whose config changed
  ansible.builtin.systemd:
    name: "unbound@{{ item.item.key }}"
    state: restarted
  loop: "{{ unbound_view_render.results }}"
  when: item.changed

- name: Restart unbound views whose auth-zone zonefile changed
  ansible.builtin.systemd:
    name: "unbound@{{ item.item.0.key }}"
    state: restarted
  loop: "{{ unbound_view_zone_render.results }}"
  when: item.changed
