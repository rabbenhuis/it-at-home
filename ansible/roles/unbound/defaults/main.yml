  - { type: "A", name: "unbound-pri01.infra.abbenhuis.internal", value: "192.168.90.41" }
  - { type: "A", name: "adguard-sec01.infra.abbenhuis.internal", value: "192.168.90.42" }
  - { type: "A", name: "unbound-sec01.infra.abbenhuis.internal", value: "192.168.90.43" }
