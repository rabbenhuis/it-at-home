unbound_views:
  internal-full:
    port: 5353
    records: "{{ unbound_records_full }}"
    ptr_records: "{{ unbound_ptr_full }}"
  internal-limited:
    port: 5354
    records: "{{ unbound_records_limited }}"
    ptr_records: "{{ unbound_ptr_limited }}"
  iot-platform:
    port: 5355
    records: "{{ unbound_records_full }}"
    ptr_records: "{{ unbound_ptr_full }}"
  iot-limited:
    port: 5356
    records: []
    ptr_records: []
  gaming-limited:
    port: 5357
    records: []
    ptr_records: []

# Static reverse (PTR) records so AdGuard shows fixed-IP clients by hostname
# via rDNS. Grouped per VLAN; the reverse zone is derived as
# <vlan>.168.192.in-addr.arpa. (assumes a /24 in 192.168.0.0/16). Served as
# local-data-ptr on the main resolver (port 53).
# Add a group for each VLAN with fixed-IP clients (37/70/75/80/90/95/100/115/120/132/150):
unbound_local_ptrs:
  - vlan: 90
    records:
      - ip: "192.168.90.40"
        name: "adguard-pri01.infra.abbenhuis.internal"
      - ip: "192.168.90.41"
        name: "unbound-pri01.infra.abbenhuis.internal"
      - ip: "192.168.90.42"
        name: "adguard-sec01.infra.abbenhuis.internal"
      - ip: "192.168.90.43"
        name: "unbound-sec01.infra.abbenhuis.internal"
      - ip: "192.168.90.44"
        name: "avahi01.infra.abbenhuis.internal"
  - vlan: 100
    records:
      - ip: "192.168.100.40"
        name: "haos01.apps.abbenhuis.internal"
      - ip: "192.168.100.50"
        name: "qnap01.abbenhuis.internal"
