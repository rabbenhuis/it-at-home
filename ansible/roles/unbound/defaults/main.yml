# Unbound recursive resolver role defaults.
unbound_verbosity: 1

# Interface unbound listens on (defaults to the host's primary IPv4).
unbound_listen_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

# Only these clients may query the resolver (AdGuard Home servers).
# Must match adguard_dns_servers in deploy/firewall.tf.
unbound_allowed_clients:
  - "192.168.90.40"
  - "192.168.90.42"

unbound_qname_minimisation: true
unbound_cache_min_ttl: 300
unbound_cache_max_ttl: 86400

# ---------------------------------------------------------------------------
# Internal records live in a private-only auth-zone (abbenhuis.internal).
# `.internal` is IANA-reserved and never delegated in the public root, so it has
# no public records and no DS/trust anchor. That is what makes CNAMEs work here:
# with `for-downstream: no` + `for-upstream: yes` the auth-zone is consulted
# during recursion and CNAME targets are resolved into a complete answer.
# (unbound does NOT expand CNAMEs served from local-data, and an auth-zone on
# the public `abbenhuis.net` fails because that zone is DNSSEC-signed.)
#
# Each view renders its own zonefile from its record list, so the per-VLAN
# visibility split is preserved. The public `abbenhuis.net` zone is untouched
# and resolves via normal recursion.
# ---------------------------------------------------------------------------
unbound_auth_zones:
  - name: "abbenhuis.internal"
    for_downstream: no
    for_upstream: yes

# SOA serial for the per-view auth-zone zonefiles. Bump when records change.
unbound_auth_zone_serial: 2026092101

# TTL for the auth-zone records and SOA minimum.
unbound_auth_zone_ttl: 300

# The internal zone is unsigned; declare it insecure so the DNSSEC validator
# does not try to validate its contents (an auth-zone with for-upstream: yes
# is validated before serving, which would otherwise SERVFAIL).
unbound_auth_zone_insecure: true

# Full internal record set (internal-full + iot-platform views). A + CNAME
# records together; the template renders them into the view's auth-zone zonefile.
unbound_records_full:
