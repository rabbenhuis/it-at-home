# Unbound recursive resolver role defaults.
unbound_verbosity: 1

# Interface unbound listens on (defaults to the host's primary IPv4).
unbound_listen_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

# Only these clients may query the resolver (AdGuard Home servers).
# Must match adguard_dns_servers in deploy/firewall.tf.
unbound_allowed_clients:
  - "192.168.90.40"
  - "192.168.90.42"

unbound_qname_minimisation: true
unbound_cache_min_ttl: 300
unbound_cache_max_ttl: 86400

# Static reverse (PTR) records so AdGuard shows fixed-IP clients by hostname
# via rDNS. Grouped per VLAN; the reverse zone is derived as
# <vlan>.168.192.in-addr.arpa. (assumes a /24 in 192.168.0.0/16). Each
# local-data-ptr also adds the A record for the name.
# Add a group for each VLAN with fixed-IP clients (37/70/75/80/90/95/100/115/120/132/150):
unbound_local_ptrs:
  - vlan: 90
    records:
      - ip: "192.168.90.40"
        name: "adguard-pri01.infra.abbenhuis.net"
      - ip: "192.168.90.41"
        name: "unbound-pri01.infra.abbenhuis.net"
      - ip: "192.168.90.42"
        name: "adguard-sec01.infra.abbenhuis.net"
      - ip: "192.168.90.43"
        name: "unbound-sec01.infra.abbenhuis.net"
  - vlan: 100
    records:
      - ip: "192.168.100.50"
        name: "nas.abbenhuis.net"
  # - vlan: 90
  #   records:
  #     - ip: "192.168.90.50"
  #       name: "myhost.infra.abbenhuis.net"
