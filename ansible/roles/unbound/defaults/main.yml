  - { type: "A", name: "avahi01.infra.abbenhuis.internal", value: "192.168.90.44" }
  - { type: "A", name: "qnap01.abbenhuis.internal", value: "192.168.100.50" }
  - { type: "A", name: "printer.iot.abbenhuis.internal", value: "192.168.152.45" }
